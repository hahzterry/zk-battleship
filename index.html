    <!--
      Cross-Origin Isolation Bootstrapping (COOP/COEP) — must execute synchronously
      as a "classic script" before main.js.

      Aleo wasm unconditionally uses shared memory, requiring the page to be in a
      crossOriginIsolated state.

      Hosting environment handling:
        · Local vite dev/preview → vite.config.js already sets COOP/COEP headers,
                                   this script exits immediately
        · itch.io               → Enable "SharedArrayBuffer support" in Embed Options
                                   → Frame Options, headers are set automatically
        · GitHub Pages / CloudStudio → Custom headers are not supported, this script
                                        uses a Service Worker to synthesize headers
                                        and restore isolation
        · Netlify / Cloudflare Pages → public/_headers is configured
        · Vercel                → vercel.json is configured

      If any of the above paths fail, zk.js will detect it and gracefully fall back
      to local verification — the game remains playable without white screen or crashes.
      Add ?nocoi=1 to forcibly disable this script for comparison testing.
    -->
    <script src="./coi-serviceworker.js"></script>
  </head>
  <body>
    <div id="app"><div class="initial-loader"><div class="initial-loader__spinner"></div><p>Loading Shadow Fleet…</p></div></div>
    <div id="tutorial-overlay" hidden></div>
    <script type="module" src="/main.js"></script>
  </body>
